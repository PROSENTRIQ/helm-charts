{{- if and (not .Values.existingSecret) (not .Values.enrollKey) }}
{{- fail "set enrollKey or existingSecret (Settings -> Sensors -> enrollment key)" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "agent.name" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: prosentriq-agent, app.kubernetes.io/instance: {{ .Release.Name }} }
  updateStrategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 10% } }
  template:
    metadata:
      labels: {{- include "agent.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agent.name" . }}
      hostNetwork: true          # XDP attaches to the node's interface
      hostPID: true              # process freeze/thaw and /proc attribution
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: {{ .Values.priorityClassName }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: agent
          image: {{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: PROSENTRIQ_API_BASE, value: {{ .Values.apiBase | quote }} }
            - { name: PROSENTRIQ_IFACE, value: {{ .Values.interface | quote }} }
            - name: PROSENTRIQ_ENROLL_KEY
              valueFrom: { secretKeyRef: { name: {{ include "agent.secret" . }}, key: enrollKey } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            # eBPF/XDP needs these; nothing broader than the kernel requires.
            privileged: false
            capabilities:
              add: [BPF, PERFMON, NET_ADMIN, SYS_ADMIN, SYS_RESOURCE, SYS_PTRACE, KILL]
              drop: [ALL]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: bpffs, mountPath: /sys/fs/bpf, mountPropagation: Bidirectional }
            - { name: btf, mountPath: /sys/kernel/btf, readOnly: true }
            - { name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true }
            - { name: state, mountPath: /etc/prosentriq }
            - { name: data, mountPath: /var/lib/prosentriq }
      volumes:
        - { name: bpffs, hostPath: { path: /sys/fs/bpf, type: DirectoryOrCreate } }
        - { name: btf, hostPath: { path: /sys/kernel/btf, type: Directory } }
        - { name: cgroup, hostPath: { path: /sys/fs/cgroup, type: Directory } }
        # Credentials and state persist per node so a pod restart is not a re-enrollment.
        - { name: state, hostPath: { path: /var/lib/prosentriq-agent/etc, type: DirectoryOrCreate } }
        - { name: data, hostPath: { path: /var/lib/prosentriq-agent/data, type: DirectoryOrCreate } }
